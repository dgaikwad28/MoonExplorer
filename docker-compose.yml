version: '3.9'

services:
  app:
    container_name: moon_explorer
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app/
      - ./env:/app/env
    env_file:
      - env/.env
    depends_on:
      - postgres
    networks:
      - backend
      - default

  postgres:
    container_name: postgres_db
    image: postgres
    hostname: postgres
    volumes:
      - "/postgres-data/:/var/lib/postgresql/data"
    ports:
      - 5432:5432
    expose:
      - "5432"
    env_file:
      - env/.env.db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U moon_explorer_user -d moon_explorer_db -h localhost -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
      - default

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "7000:80"
    volumes:
      # TODO: improve the symlink
      - ./nginx/sites-available/default-ssl:/etc/nginx/conf.d/default.conf
      - ./nginx/sites-available/default-ssl:/etc/nginx/sites-enabled/default-ssl:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - app
    expose:
      - 7000
    networks:
      - backend
      - default

volumes:
  postgres_data:

networks:
  backend: